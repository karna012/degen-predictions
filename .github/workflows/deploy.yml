name: Test and Deploy

# CI on every push/PR (test job always runs); CD only fires on a push to
# main (or master) after the test job passes -- so a red test suite can
# never reach production, and pull requests never trigger a deploy.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (excluding slow/training tests)
        working-directory: webapp
        run: python -m pytest -q -m "not slow"

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack deploy bundle
        run: |
          tar --exclude='__pycache__' --exclude='*.pyc' --exclude='*.log' \
              --exclude='webapp/users.db' --exclude='webapp/tests/__pycache__' \
              -czf /tmp/sync_bundle.tar.gz webapp scripts

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload bundle
        run: |
          scp -i ~/.ssh/deploy_key /tmp/sync_bundle.tar.gz \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/sync_bundle.tar.gz"

      - name: Extract + restart service
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "
            cd ${{ secrets.EC2_APP_DIR }} &&
            tar xzf ~/sync_bundle.tar.gz &&
            rm ~/sync_bundle.tar.gz &&
            chmod o+rX -R webapp/static &&
            sudo systemctl restart degen-predictions &&
            sleep 2 &&
            sudo systemctl is-active degen-predictions
          "

      - name: Smoke test
        run: |
          sleep 3
          curl -sf -o /dev/null "https://${{ secrets.SITE_DOMAIN }}/" || \
            (echo "Post-deploy health check failed" && exit 1)
