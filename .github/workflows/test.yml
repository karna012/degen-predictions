name: Test

# Runs the test suite on every push/PR. There used to be a second "deploy"
# job here that SSH'd into EC2 on push to main/master, but its GitHub
# secrets (EC2_SSH_PRIVATE_KEY, EC2_HOST, etc.) were never actually
# configured, so it silently failed on every single push. Real deploys go
# through deploy/sync.sh (or the SSM run-command path) from a machine
# already allowed through the EC2 security group's SSH allowlist -- adding
# a working CI deploy path would mean opening SSH to GitHub Actions'
# runner IP range, which is a much bigger attack surface than the current
# short allowlist. Removed rather than left disabled-but-present so there's
# no dead, confusing "deploy" step sitting in the workflow file.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (excluding slow/training tests)
        working-directory: webapp
        run: python -m pytest -q -m "not slow"
