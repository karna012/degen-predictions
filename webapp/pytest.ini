[pytest]
markers =
    slow: exercises live model inference -- slower, run explicitly with -m slow if excluded
    smoke: critical path availability
    sanity: shallow checks on recent product rules
    api: HTTP/JSON API behaviour
    e2e: multi-step user journeys via the Flask test client
    integration: cross-module wiring
    regression: previously shipped behaviour
    performance: response-time guardrails (not a load test)
    security: defensive auth / CSRF / disclosure checks
    contract: response shape and content-type agreements
    blackbox: opaque HTTP checks
    ab: deterministic UX (no split experiments on this site)
testpaths = tests qa_suite

