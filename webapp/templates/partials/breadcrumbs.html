{# Visible + JSON-LD breadcrumbs. Expects `breadcrumbs` list of {name, item}. #}
{% if breadcrumbs %}
<script type="application/ld+json">{{ breadcrumb_jsonld | tojson }}</script>
<nav class="seo-breadcrumbs" aria-label="Breadcrumb">
    <ol>
        {% for c in breadcrumbs %}
        <li>
            {% if not loop.last %}
            <a href="{{ c.item | replace('https://degenpredictions.com', '') or '/' }}">{{ c.name }}</a>
            <span class="seo-bc-sep" aria-hidden="true">/</span>
            {% else %}
            <span aria-current="page">{{ c.name }}</span>
            {% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>
{% endif %}
