{% extends "base.html" %}
{% block title %}Log In -- Degen Predictions{% endblock %}
{% block description %}Log in to your Degen Predictions account.{% endblock %}
{% block content %}
<h1>Log In</h1>

<div class="card" style="max-width:60ch; margin-top:1.5rem;">
    {% if google_enabled %}
    <a href="/login/google" class="predict-btn" style="display:flex; align-items:center; justify-content:center; gap:0.5rem; text-decoration:none; margin-bottom:1.25rem;">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3c-7.7 0-14.4 4.4-17.7 11.7z"/>
            <path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 36 26.9 37 24 37c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 40.5 16.2 45 24 45z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C41.8 35.7 45 30.4 45 24c0-1.2-.1-2.4-.4-3.5z"/>
        </svg>
        Log in with Google
    </a>
    <div style="text-align:center; margin-bottom:1.25rem;" class="muted">or</div>
    {% endif %}
    <form method="post" action="/login">
        <div style="margin-bottom:1rem;">
            <label for="email" style="display:block; margin-bottom:0.3rem;">Email</label>
            <input type="email" id="email" name="email" required maxlength="200"
                   style="width:100%; padding:0.55rem 0.8rem; border-radius:8px; border:1px solid var(--border, #444); background:var(--card-bg, #1a1a1a); color:inherit;">
        </div>
        <div style="margin-bottom:1rem;">
            <label for="password" style="display:block; margin-bottom:0.3rem;">Password</label>
            <input type="password" id="password" name="password" required maxlength="200"
                   style="width:100%; padding:0.55rem 0.8rem; border-radius:8px; border:1px solid var(--border, #444); background:var(--card-bg, #1a1a1a); color:inherit;">
        </div>
        <button type="submit" class="predict-btn">Log In</button>
    </form>
    <p class="muted" style="margin-top:1rem;">Don't have an account? <a href="/signup">Sign up</a>.</p>
</div>
{% endblock %}
