# /etc/nginx/sites-available/degen-predictions
# Replace YOUR_DOMAIN with your real domain (e.g. degenpredictions.com) in
# both server blocks below before enabling this site.
#
# Also install deploy/nginx-limits.conf → /etc/nginx/conf.d/degen-limits.conf
# so limit_req zones exist before this server block is loaded.

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # certbot (Let's Encrypt) will add its own location block here and
    # rewrite this file to redirect everything else to HTTPS -- see DEPLOY.md
    # step 7. Leave this file as plain HTTP first; certbot --nginx handles
    # the HTTPS upgrade automatically.

    client_max_body_size 8m;

    # Security headers (also set at Cloudflare; these cover origin-IP hits)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml;

    # Admin + locked ops — stricter rate limit
    location ^~ /admin {
        limit_req zone=degen_admin burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location ^~ /todays-picks/digest {
        limit_req zone=degen_admin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /feedback {
        limit_req zone=degen_feedback burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expensive ML predict APIs
    location ~* /api/predict {
        limit_req zone=degen_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=degen_general burst=40 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/ubuntu/Degen_predictions/webapp/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
