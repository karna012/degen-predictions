# /etc/nginx/sites-available/degen-predictions
# Replace YOUR_DOMAIN with your real domain (e.g. degenpredictions.com) in
# both server blocks below before enabling this site.

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # certbot (Let's Encrypt) will add its own location block here and
    # rewrite this file to redirect everything else to HTTPS -- see DEPLOY.md
    # step 7. Leave this file as plain HTTP first; certbot --nginx handles
    # the HTTPS upgrade automatically.

    # Gzip: cuts HTML/CSS/JS/JSON response sizes substantially with near-zero
    # CPU cost, which speeds up page load (a real Core Web Vitals / SEO
    # ranking factor) -- images/fonts are excluded since they're already
    # compressed formats and gzipping them again wastes CPU for no gain.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/ubuntu/Degen_predictions/webapp/static/;
        # Every static reference already carries a cache-busting ?v=<mtime>
        # query string (see static_version() in app.py) -- the URL itself
        # changes the instant a file's content changes, so it's safe to
        # cache aggressively (was 5m + must-revalidate under the mistaken
        # assumption there was no cache-busting at all, which cost real
        # PageSpeed "efficient cache lifetimes" points for no reason).
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
