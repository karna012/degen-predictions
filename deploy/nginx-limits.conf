# Rate-limit zones for degenpredictions.com
# Install to: /etc/nginx/conf.d/degen-limits.conf
# (must live in the http{} context — conf.d is included from nginx.conf)

# Prefer Cloudflare visitor IP when present; else direct client.
map $http_cf_connecting_ip $degen_limit_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $degen_limit_key zone=degen_general:10m rate=20r/s;
limit_req_zone $degen_limit_key zone=degen_admin:10m rate=5r/s;
limit_req_zone $degen_limit_key zone=degen_api:10m rate=3r/s;
limit_req_zone $degen_limit_key zone=degen_feedback:10m rate=1r/s;
